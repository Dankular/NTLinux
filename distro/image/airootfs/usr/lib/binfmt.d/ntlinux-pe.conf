# systemd-binfmt registration for PE (Windows) executables -> ntloader.
#
# Read by systemd-binfmt.service at boot (and by `systemd-binfmt` manually)
# and written into the kernel's binfmt_misc registration interface
# (/proc/sys/fs/binfmt_misc/register). Format is the same as the kernel's
# own register syntax: https://docs.kernel.org/admin-guide/binfmt-misc.html
#
#   :name:type:offset:magic:mask:interpreter:flags
#
# - name: ntlinux-pe (shows up as /proc/sys/fs/binfmt_misc/ntlinux-pe)
# - type: M (magic-number match)
# - offset: 0 (the "MZ" DOS header signature is always at the start)
# - magic: 4d5a ("MZ" in hex)
# - mask:  (empty - exact match on the two magic bytes is enough; unlike
#           some other binfmt entries this doesn't need to distinguish
#           multiple sub-formats sharing a prefix)
# - interpreter: /usr/libexec/ntloader
# - flags: (empty)
#
# Verified in-session (see docs/DECISIONS.md / ROADMAP.md Phase 1): this
# exact registration, with a real compiled ntloader at /usr/libexec/ntloader,
# was used to run `./notepad.exe` directly (Wine's own bundled notepad.exe)
# with no explicit `wine` invocation - the kernel dispatched it through
# ntloader into Wine and a real window appeared on a virtual display.
:ntlinux-pe:M::MZ::/usr/libexec/ntloader:
