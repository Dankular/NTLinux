# Mirrors getty@tty1.service.d/autologin.conf (upstream releng, autologin on
# the virtual console) but for the serial console. releng doesn't ship this;
# added for NTLinux so the live image can be driven headlessly over a serial
# line (QEMU -serial, CI runners, cloud VMs without a virtual GPU) the same
# way it already works interactively on tty1 — useful for Phase 0
# verification and later CI boot-testing, not just local development.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin root --noclear --keep-baud 115200,57600,38400,9600 %I $TERM
