# Pacman config for building the NTLinux archiso image.
# Mirrors the standard archiso releng pacman.conf; diff against
# https://gitlab.archlinux.org/archlinux/archiso releng/pacman.conf before
# building, since mirror/repo config on the Arch side can change.

[options]
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib is required for the lib32-* packages in packages.x86_64
# (32-bit Mesa/Vulkan for WoW64 game compatibility, section 11).
[multilib]
Include = /etc/pacman.d/mirrorlist

# Not enabled by default: a Chaotic-AUR-style repo would be needed to
# pull dxvk-bin/vkd3d-proton as prebuilt packages instead of building them
# from AUR PKGBUILDs during the ISO build (see packages.x86_64 note).
#[ntlinux-extra]
#Server = https://example.invalid/ntlinux-extra/os/$arch
