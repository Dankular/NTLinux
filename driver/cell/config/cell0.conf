# cell0.conf — example per-cell configuration profile
# (ARCHITECTURE.md section 27, "Mode A — one global NT driver cell").
#
# NOT yet consumed by ntcell (driver/cell/launcher/ntcell) — that script
# currently takes everything as command-line flags with fixed defaults
# rather than reading a config file, which is fine for the single-cell
# Phase 4 prototype. This file exists to give Mode A's shape a concrete
# starting point for when Mode B/C (per-driver-class or per-driver cell
# granularity) need distinct profiles to select between, rather than
# inventing the config format at that point from nothing. Wiring ntcell
# to actually read files like this is follow-up work, not done here —
# tracked, not silently assumed.

[cell]
name = cell0
mode = A                    # A = one global cell, B/C = finer-grained (section 27)

[boot]
image = ../images/ReactOS-0.4.15-release-1-gdbb43bbaeb2-x86.iso
memory_mb = 512
accel = auto                # auto = kvm if /dev/kvm is usable, else tcg

[ntbridge]
shm_path = /dev/shm/ntlinux-ntbridge-cell0
shm_size_mb = 1
protocol_version = 1        # must match NTBRIDGE_PROTOCOL_VERSION in
                             # driver/ntbridge/protocol/ntbridge_protocol.h
